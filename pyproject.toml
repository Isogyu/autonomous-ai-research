[project]
name = "autonomous-ai-research"
version = "0.1.0"
description = "論文の発見から独自検証、独立監査、発信準備までを一貫して実行する自律型研究基盤"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.20",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "markdown>=3.6",
  "numpy>=1.26",
  "psutil>=5.9",                          # 起動・停止の入口（PID の本人確認、子孫の回収）
  "tzdata; sys_platform == 'win32'",       # Windows には IANA のタイムゾーンのデータがない
]

[project.optional-dependencies]
# 埋め込みをローカル CPU で計算する（ONNX。PyTorch は使わない）
embed = ["fastembed>=0.4"]
# 論文の本文を PDF から取り出す（arXiv の HTML 版が無い論文向け）
fulltext = ["pypdf>=4"]


dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
aar = "aar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aar = ["db/migrations/*.sql", "ui/templates/*.html", "prompts/*.md", "publish/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: 実際の PostgreSQL＋pgvector が必要（AAR_TEST_DATABASE_URL を設定したときだけ実行）",
  "live: 外部 API や実際のエージェント CLI を呼ぶ（AAR_LIVE=1 のときだけ実行）",
  "podman: 実物の Podman でコンテナを動かす（AAR_PODMAN_TESTS=1 のときだけ実行。AAR_REQUIRE_PODMAN=1 なら、使えないときは skip ではなく失敗）",
  "windows_only: Windows でだけ意味のある確認（ほかの OS では skip。skip は Windows での合格に数えない）",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
