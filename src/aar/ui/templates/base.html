<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if refresh %}<meta http-equiv="refresh" content="15">{% endif %}
<title>{% block title %}自律研究パイプライン{% endblock %}</title>
<style>
:root { --bg:#fafafa; --fg:#1d1d1f; --muted:#5f6368; --card:#fff; --line:#d9d9de; --accent:#0b57d0;
  --ok:#146c2e; --warn:#8a5a00; --bad:#b3261e; --tag:#eef0f4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#16171a; --fg:#ececef; --muted:#a0a4ab; --card:#1f2024; --line:#3a3c42; --accent:#8ab4f8;
    --ok:#7bd88f; --warn:#f0c36b; --bad:#ff8a80; --tag:#2b2d33; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); line-height:1.7; font-size:16px;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
a { color:var(--accent); }
header.top { border-bottom:1px solid var(--line); background:var(--card); }
header.top nav { max-width:60rem; margin:0 auto; padding:.5rem 1rem; display:flex; flex-wrap:wrap; gap:.25rem 1.25rem; }
header.top a { text-decoration:none; font-weight:bold; }
main { max-width:60rem; margin:0 auto; padding:1rem; }
h1 { font-size:1.5rem; margin:.5rem 0 1rem; } h2 { font-size:1.2rem; margin:2rem 0 .5rem; border-bottom:1px solid var(--line); padding-bottom:.25rem; }
h3 { font-size:1rem; margin:1rem 0 .25rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:.75rem 1rem; margin:.75rem 0; }
.card h2, .card h3 { border:0; margin-top:0; }
.muted { color:var(--muted); font-size:.9rem; }
.tag { display:inline-block; background:var(--tag); border:1px solid var(--line); border-radius:4px; padding:0 .4rem; font-size:.85rem; margin-right:.25rem; }
.ok { color:var(--ok); font-weight:bold; } .warn { color:var(--warn); font-weight:bold; } .bad { color:var(--bad); font-weight:bold; }
.notice { border:2px solid var(--warn); border-radius:6px; padding:.5rem 1rem; margin:.75rem 0; font-weight:bold; }
.error { border:2px solid var(--bad); color:var(--bad); border-radius:6px; padding:.5rem 1rem; margin:.75rem 0; }
.tablewrap { overflow-wrap:anywhere; }
table { border-collapse:collapse; width:100%; font-size:.95rem; table-layout:auto; }
th, td { border-bottom:1px solid var(--line); padding:.3rem .4rem; text-align:left; vertical-align:top; overflow-wrap:anywhere; word-break:break-word; }
th { color:var(--muted); font-weight:normal; font-size:.85rem; }
dl { margin:0; } dt { font-weight:bold; margin-top:.75rem; } dd { margin:0 0 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
button, .button { font:inherit; padding:.5rem 1rem; border:1px solid var(--accent); background:var(--accent); color:var(--bg);
  border-radius:6px; cursor:pointer; min-height:2.5rem; }
button.sub { background:transparent; color:var(--accent); }
button.danger { background:transparent; color:var(--bad); border-color:var(--bad); }
form.inline { display:inline-block; margin:.25rem .25rem .25rem 0; }
input[type=text], input[type=search] { font:inherit; padding:.45rem; width:100%; max-width:30rem; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
label.check { display:inline-block; margin-right:1rem; }
code { overflow-wrap:anywhere; font-size:.9rem; }
ul { padding-left:1.25rem; }
</style>
</head>
<body>
<header class="top"><nav>
<a href="/">検証企画</a><a href="/projects">研究</a><a href="/search">検索</a><a href="/metrics">自己評価</a>
</nav></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
