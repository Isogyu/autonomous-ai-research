<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1000" width="1024" height="1000" role="img" aria-label="試す・自環境で検証済み。コンテナの隔離が効いているか、中から確かめる。図: 隔離を、どう確かめるか（内容は本文に文章で記載）" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif"><title>試す・自環境で検証済み。コンテナの隔離が効いているか、中から確かめる。図: 隔離を、どう確かめるか（内容は本文に文章で記載）</title><rect width="100%" height="100%" fill="#ffffff"/><rect x="56" y="56" width="104" height="56" rx="10" fill="#111111" stroke="#111111" stroke-width="3"/><text x="74" y="94" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">試す</text><rect x="176" y="56" width="308" height="56" rx="10" fill="#0b4f9e" stroke="#0b4f9e" stroke-width="3"/><text x="194" y="94" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">自環境で検証済み</text><text x="56" y="200" font-size="54" font-weight="700" fill="#111111" text-anchor="start">コンテナの隔離が効いているか、中</text><text x="56" y="262" font-size="54" font-weight="700" fill="#111111" text-anchor="start">から確かめる</text><text x="56" y="336" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="start">隔離を、どう確かめるか</text><rect x="56" y="354" width="912" height="64" rx="10" fill="#eef2f7"/><text x="86" y="400" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="middle">1</text><text x="120" y="400" font-size="36" font-weight="700" fill="#111111" text-anchor="start">イメージを取得して固定する</text><rect x="56" y="430" width="912" height="64" rx="10" fill="#eef2f7"/><text x="86" y="476" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="middle">2</text><text x="120" y="476" font-size="36" font-weight="700" fill="#111111" text-anchor="start">制限を指定して起動する</text><rect x="56" y="506" width="912" height="108" rx="10" fill="#eef2f7"/><text x="86" y="552" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="middle">3</text><text x="120" y="552" font-size="36" font-weight="700" fill="#111111" text-anchor="start">中から制限を確かめる</text><text x="120" y="596" font-size="32" font-weight="400" fill="#454545" text-anchor="start">通信・書き込み・上限・権限</text><rect x="56" y="626" width="912" height="64" rx="10" fill="#eef2f7"/><text x="86" y="672" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="middle">4</text><text x="120" y="672" font-size="36" font-weight="700" fill="#111111" text-anchor="start">通らなければ実行しない</text><rect x="56" y="726" width="912" height="168" rx="10" fill="#fff1c2" stroke="#4a3200" stroke-width="2"/><text x="76" y="772" font-size="34" font-weight="700" fill="#4a3200" text-anchor="start">条件・制約</text><text x="76" y="826" font-size="34" font-weight="400" fill="#4a3200" text-anchor="start">・確認は Linux だけ。Windows は未確認</text><text x="76" y="872" font-size="34" font-weight="400" fill="#4a3200" text-anchor="start">・手順のコードは未マージ（PR #12）</text><text x="56" y="958" font-size="32" font-weight="400" fill="#454545" text-anchor="start">出典: このリポジトリ（確認 2026-11-25） ほか 1 件</text></svg>
