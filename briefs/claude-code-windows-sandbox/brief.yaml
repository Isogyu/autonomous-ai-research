  relevance: 社内の PC は Windows。導入の形（Windows に直接か、WSL 2 か）で、使える機能が変わる
  need:
    who: 社内の Windows PC で AI のコーディング支援を試したい開発の担当
    wants_to: 導入の形を決める前に、形によって何が変わるかを把握したい
