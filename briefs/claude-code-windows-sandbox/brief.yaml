  question: 導入の形で、何が変わるか
  columns: [サンドボックス, Git for Windows]
  rows:
    - {label: Windows に直接, cells: [非対応, 推奨]}
    - {label: WSL 2, cells: [対応, 不要]}
    - {label: WSL 1, cells: [非対応, 不要]}
  long_description: 公式の文書の表によると、OS によるサンドボックスに対応するのは WSL 2 だけで、Windows に直接入れた場合と WSL 1 は対応していない。Git for Windows は、Windows に直接入れる場合に推奨されている（無い場合は PowerShell が使われる）。WSL では不要。
detail:
  conclusion: Claude Code は Windows 10 1809 以降に直接入れられる。ただし、OS によるサンドボックスに対応するのは WSL 2 に入れた場合だけ。
  applies_when:
    - 社内の Windows PC で Claude Code を使うことを検討している
    - 導入の形（Windows に直接か、WSL 2 か）をまだ決めていない
  overview: 公式の文書は、Windows での導入の形として、Windows に直接、WSL 2、WSL 1 を挙げ、それぞれのサンドボックスの対応を表で示している。導入の方法は、PowerShell のインストーラー、WinGet、npm、WSL の中での Linux 向けの方法。
  confirmed_scope:
    - 2026-11-25 に、公式の文書の該当のページを読んだ
    - 読んだのは導入のページだけ。サンドボックスの仕組みを説明するページは読んでいない
    - 自分たちの PC では、Windows でも WSL でも動かしていない
