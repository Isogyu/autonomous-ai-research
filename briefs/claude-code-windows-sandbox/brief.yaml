headline: Claude Code は Windows で動く。隔離は WSL 2 だけ
takeaways:
  - Windows 10 1809 以降なら、Windows に直接入れられる
  - OS によるサンドボックスは WSL 2 でだけ対応
  - Windows に直接入れる場合は Git for Windows が推奨
constraints:
  - 社内で Claude Code と WSL 2 を使えるかは未確認
  - サンドボックスが何を制限するかは、まだ読んでいない
unconfirmed:
  - 社内で Claude Code と WSL 2 の利用が許可されているか
  - サンドボックスが制限する範囲（ファイル、通信）。該当する文書を読んでいない
  - 自分たちの Windows PC での動作
change: 「Windows では WSL が必要」という理解は古い。Windows に直接入れられるが、サンドボックスの対応は導入の形で違う
why_now: 開発の対象を社内の Windows PC に移す準備を始めた。導入の形を決める前に知っておく必要がある
evidence_strength: moderate
evidence_strength_note: 提供元の公式の文書（一次情報）で、内容は明確。ただし自分たちでは確かめておらず、文書に更新日の記載がない
