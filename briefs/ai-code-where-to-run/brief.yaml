id: ai-code-where-to-run
purpose: decide
verification: introduced_unreproduced
verification_basis: 各提供元の公式の文書を読み比べただけ。社内の Windows PC では、どの方式も動かしていない
audience:
  segment: 社内の Windows PC で、AI が書いたコードを動かして試そうとしている開発の担当
  relevance: AI が書いたコードは、中身を全部読む前に動かすことがある。どこで動かすかで、PC と社内のデータへの影響の範囲が変わる
  need:
    who: AI が書いたコードを社内の PC で動かして試したい開発の担当
    wants_to: 動かす場所の選択肢と、それぞれに要る社内の確認を比べたい
    so_that: 自分の用途に合う方式を選び、必要な申請を先に出せる
    evidence: assumed
    evidence_note: 読者に確かめていない。この判断に実際に困っている人がいるかは、docs/briefs/reader-needs.md の質問で確かめる
headline: AI が書いたコードを、社内 PC のどこで動かすか
takeaways:
  - そのまま動かすと、自分の権限で届く範囲すべてに触れる
  - Podman のコンテナは、通信と書き込み先を指定して絞れる
  - どの隔離の方式も、社内の許可の確認が先に要る
constraints:
  - 社内の Windows PC では、どの方式も未実行
  - WSL 2 と仮想化の機能を使えるかは、社内で未確認
  - コンテナに替えるだけでは、隔離は成立しない
unconfirmed:
  - 社内で WSL 2、Hyper-V、Podman を使えるか
  - Claude Code の WSL 2 でのサンドボックスが制限する範囲（該当の文書を読んでいない）
  - Windows 上の Podman の仮想環境で、指定した制限が実際に効くか（Linux での確認は別の投稿候補 podman-isolation-verify にある）
change: これまでは macOS の機能と Docker を前提にしていた。Windows に移すと、選べる方式と、要る確認が変わる
why_now: 開発の対象を社内の Windows PC に移す準備を始めた。方式によって、先に出す申請が違う
evidence_strength: moderate
evidence_strength_note: 各提供元の公式の文書（一次情報）に基づく。ただし、方式どうしを同じ条件で比べた実測ではなく、社内の環境での確認もない
sources:
  - title: podman-run（Podman の公式の文書）
    url: https://docs.podman.io/en/latest/markdown/podman-run.1.html
    publisher: Podman
    kind: primary
    checked_on: 2026-11-25
    version: latest（ページに版の記載なし）
    supports: 通信を持たせない指定（--network none）、ルートを読み取り専用にする指定、資源の上限の指定と、その指定が使えない構成があること
    read_scope: partial
  - title: Installing Podman Desktop and Podman on Windows
    url: https://podman-desktop.io/docs/installation/windows-install
    publisher: Podman Desktop
    kind: primary
    checked_on: 2026-11-25
    version: ページに版の記載なし
    supports: Windows では仮想環境が要り、その提供元は WSL 2 か Hyper-V であること。機能の有効化に管理者の権限が要ること
  - title: Advanced setup（Claude Code Docs）
    url: https://code.claude.com/docs/en/setup
    publisher: Anthropic
    kind: primary
    checked_on: 2026-11-25
    version: ページに更新日と版の記載なし
    supports: Claude Code のサンドボックスは WSL 2 でだけ対応し、Windows に直接入れた場合は対応しないこと
diagram:
  kind: comparison
  question: 動かす場所で、隔離と、要る確認はどう違うか
  columns: [隔離の範囲, 社内で要る確認]
  rows:
    - {label: そのまま実行, cells: [なし, なし]}
    - {label: WSL 2 の隔離機能, cells: [未確認, WSL 2 の許可]}
    - {label: Podman コンテナ, cells: [指定した範囲, 仮想化の許可]}
  long_description: そのまま実行する場合は、隔離がなく、追加の確認も要らない。Claude Code の WSL 2 でのサンドボックスは、制限する範囲を確かめておらず、WSL 2 の利用の許可が要る。Podman のコンテナは、通信と書き込み先を指定した範囲に絞れるが、Windows では仮想環境（WSL 2 か Hyper-V）の利用の許可が要る。
detail:
  conclusion: 中身を読み切れていないコードを動かすなら、通信と書き込み先を絞れる方式が要る。Podman のコンテナは絞る指定を持つが、Windows では仮想化の機能の許可が前提で、指定が実際に効くかは環境ごとに確かめる必要がある。
  applies_when:
    - AI が書いたコードを、全部を読む前に社内の PC で動かしたい
    - 社内のデータや認証情報に届く PC で作業している
  comparison_basis:
    - 比べたのは、公式の文書に書かれた機能の有無。同じ課題を各方式で動かした実測ではない
    - 「そのまま実行」は、追加の仕組みを使わない場合。動かしたコードは、利用者の権限で届く範囲すべてに触れられる
    - Podman の公式の文書は、通信を持たせない指定と、ルートを読み取り専用にする指定を説明している
    - 同じ文書は、資源の上限の指定が使えない構成があると書いている。指定を受け付けることと、効くことは別
    - Podman Desktop の公式の文書によると、Windows では WSL 2 か Hyper-V の仮想環境が要る
    - Claude Code の公式の文書は、サンドボックスが WSL 2 でだけ対応すると書いている。何を制限するかは、このページからは分からない
similar_posts: [claude-code-windows-sandbox, podman-isolation-verify]
similar_checked: 同じ出典を使う候補が 2 件ある。導入の形の紹介（知る）と、隔離の確かめ方（試す）で、この候補は方式の比較（判断する）
triage: candidate
triage_reason: 方式ごとに先に出す申請が違うので、移行の準備の時期に知らせる意味がある。実測がない点は、検証の状況と制約に書いた
updated_on: 2026-11-25
