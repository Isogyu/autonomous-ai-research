<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 978" width="1024" height="978" role="img" aria-label="判断する・情報紹介・未再現。AI が書いたコードを、社内 PC のどこで動かすか。図: 動かす場所で、隔離と、要る確認はどう違うか（内容は本文に文章で記載）" font-family="'Yu Gothic UI','Meiryo','Hiragino Sans','Noto Sans JP',sans-serif"><title>判断する・情報紹介・未再現。AI が書いたコードを、社内 PC のどこで動かすか。図: 動かす場所で、隔離と、要る確認はどう違うか（内容は本文に文章で記載）</title><rect width="100%" height="100%" fill="#ffffff"/><rect x="56" y="56" width="172" height="56" rx="10" fill="#111111" stroke="#111111" stroke-width="3"/><text x="74" y="94" font-size="34" font-weight="700" fill="#ffffff" text-anchor="start">判断する</text><rect x="244" y="56" width="308" height="56" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-dasharray="10 6"/><text x="262" y="94" font-size="34" font-weight="700" fill="#111111" text-anchor="start">情報紹介・未再現</text><text x="56" y="200" font-size="54" font-weight="700" fill="#111111" text-anchor="start">AI が書いたコードを、社内 PC の</text><text x="56" y="262" font-size="54" font-weight="700" fill="#111111" text-anchor="start">どこで動かすか</text><text x="56" y="336" font-size="36" font-weight="700" fill="#0b4f9e" text-anchor="start">動かす場所で、隔離と、要る確認はどう違うか</text><rect x="56" y="354" width="912" height="70" fill="#eef2f7"/><text x="532" y="400" font-size="34" font-weight="700" fill="#454545" text-anchor="middle">隔離の範囲</text><text x="822" y="400" font-size="34" font-weight="700" fill="#454545" text-anchor="middle">社内で要る確認</text><text x="64" y="470" font-size="34" font-weight="700" fill="#111111" text-anchor="start">そのまま実行</text><text x="532" y="470" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">なし</text><text x="822" y="470" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">なし</text><line x1="56" y1="494" x2="968" y2="494" stroke="#8a8a8a" stroke-width="2"/><text x="64" y="540" font-size="34" font-weight="700" fill="#111111" text-anchor="start">WSL 2 の隔離機能</text><text x="532" y="540" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">未確認</text><text x="822" y="540" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">WSL 2 の許可</text><line x1="56" y1="564" x2="968" y2="564" stroke="#8a8a8a" stroke-width="2"/><text x="64" y="610" font-size="34" font-weight="700" fill="#111111" text-anchor="start">Podman コンテナ</text><text x="532" y="610" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">指定した範囲</text><text x="822" y="610" font-size="34" font-weight="400" fill="#111111" text-anchor="middle">仮想化の許可</text><line x1="56" y1="634" x2="968" y2="634" stroke="#8a8a8a" stroke-width="2"/><rect x="56" y="658" width="912" height="214" rx="10" fill="#fff1c2" stroke="#4a3200" stroke-width="2"/><text x="76" y="704" font-size="34" font-weight="700" fill="#4a3200" text-anchor="start">条件・制約</text><text x="76" y="758" font-size="34" font-weight="400" fill="#4a3200" text-anchor="start">・社内の Windows PC では、どの方式も未実行</text><text x="76" y="804" font-size="34" font-weight="400" fill="#4a3200" text-anchor="start">・WSL 2 と仮想化の機能を使えるかは、社内で未確認</text><text x="76" y="850" font-size="34" font-weight="400" fill="#4a3200" text-anchor="start">・コンテナに替えるだけでは、隔離は成立しない</text><text x="56" y="936" font-size="32" font-weight="400" fill="#454545" text-anchor="start">出典: Podman（確認 2026-11-25） ほか 2 件</text></svg>
