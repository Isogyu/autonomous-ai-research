name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: aar
          POSTGRES_PASSWORD: aar
          POSTGRES_DB: aar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aar -d aar_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AAR_TEST_DATABASE_URL: postgresql://aar:aar@127.0.0.1:5432/aar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # エージェントは台本に置き換え、Temporal の開発用サーバーと PostgreSQL は実物を使う。外部 API は呼ばない
      - run: pytest -q
